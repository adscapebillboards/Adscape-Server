<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Player Dashboard</title>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .stat-label {
            color: #666;
            font-size: 1rem;
        }
        
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
        }
        
        .player-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }
        
        .player-card.playing {
            border-left: 5px solid #4CAF50;
            box-shadow: 0 10px 30px rgba(76, 175, 80, 0.2);
        }
        
        .player-card.inactive {
            border-left: 5px solid #f44336;
            opacity: 0.7;
        }
        
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .player-id {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
        }
        
        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .status-active {
            background: #e8f5e8;
            color: #4CAF50;
        }
        
        .status-inactive {
            background: #ffebee;
            color: #f44336;
        }
        
        .status-playing {
            background: #e3f2fd;
            color: #2196F3;
        }
        
        .player-info {
            margin-bottom: 15px;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        
        .info-label {
            color: #666;
        }
        
        .info-value {
            color: #333;
            font-weight: 500;
        }
        
        .current-asset {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
        }
        
        .asset-title {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 8px;
        }
        
        .asset-url {
            font-size: 0.8rem;
            color: #333;
            word-break: break-all;
            background: white;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #e0e0e0;
        }

        .asset-url-img {
            width: 250px;
            height: auto
}
        
        .connection-status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            z-index: 1000;
        }
        
        .connected {
            background: #4CAF50;
            color: white;
        }
        
        .disconnected {
            background: #f44336;
            color: white;
        }
        
        .no-players {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            margin-top: 50px;
        }
        
        .refresh-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        
        .refresh-btn:hover {
            background: #5a6fd8;
            transform: scale(1.1);
        }
        
        .timestamp {
            font-size: 0.8rem;
            color: #999;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="connection-status" id="connectionStatus">Connecting...</div>
   
    <div class="container">
        <div class="header">
            <h1>🎬 Live Player Dashboard</h1>
            <p>Real-time monitoring of all billboard players</p>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalPlayers">0</div>
                <div class="stat-label">Total Players</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="activePlayers">0</div>
                <div class="stat-label">Active Players</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="playingPlayers">0</div>
                <div class="stat-label">Currently Playing</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="inactivePlayers">0</div>
                <div class="stat-label">Inactive Players</div>
            </div>
        </div>
        
        <div class="players-grid" id="playersGrid">
            <div class="no-players">No players connected yet...</div>
        </div>
    </div>
    
    <button class="refresh-btn" onclick="refreshData()" title="Refresh Data">🔄</button>
    
    <script>
        const socket = io('http://localhost:4000');
        const players = new Map();
        
        // Connection status
        socket.on('connect', () => {
            console.log('Connected to server');
            document.getElementById('connectionStatus').textContent = 'Connected';
            document.getElementById('connectionStatus').className = 'connection-status connected';
        });
        
        socket.on('disconnect', () => {
            console.log('Disconnected from server');
            document.getElementById('connectionStatus').textContent = 'Disconnected';
            document.getElementById('connectionStatus').className = 'connection-status disconnected';
        });
        
        // Listen for player status updates
        socket.on('player-status-update', (data) => {
            console.log('Player status update:', data);
            updatePlayerStatus(data);
        });
        
        // Listen for asset playing updates
        socket.on('asset-status-update', (data) => {
            console.log('Asset status update:', data);
            updateAssetStatus(data);
        });
        
        function updatePlayerStatus(data) {
            const playerId = data.machineId;
            const existingPlayer = players.get(playerId) || {};
            
            players.set(playerId, {
                ...existingPlayer,
                machineId: data.machineId,
                screenId: data.screenId,
                status: data.status,
                lastActive: data.lastActive,
                lastUpdate: new Date().toISOString()
            });
            
            updateDisplay();
        }
        
        function updateAssetStatus(data) {
            const playerId = data.machineId;
            const existingPlayer = players.get(playerId) || {};
            
            players.set(playerId, {
                ...existingPlayer,
                machineId: data.machineId,
                screenId: data.screenId,
                currentAsset: data.currentAsset,
                isPlaying: data.isPlaying,
                assetTimestamp: data.timestamp,
                lastUpdate: new Date().toISOString()
            });
            
            updateDisplay();
        }
        
        function updateDisplay() {
            const playersGrid = document.getElementById('playersGrid');
            const totalPlayers = players.size;
            let activePlayers = 0;
            let playingPlayers = 0;
            let inactivePlayers = 0;
            
            if (totalPlayers === 0) {
                playersGrid.innerHTML = '<div class="no-players">No players connected yet...</div>';
                updateStats(0, 0, 0, 0);
                return;
            }
            
            let html = '';

            console.log('Updating display with', totalPlayers, 'players');
            console.log('Players:', players);
            
            players.forEach((player, playerId) => {
                if (player.status === 'active') activePlayers++;
                if (player.status === 'inactive') inactivePlayers++;
                if (player.isPlaying) playingPlayers++;
                
                const statusClass = player.isPlaying ? 'playing' : 
                                  player.status === 'inactive' ? 'inactive' : '';
                
                const statusBadge = player.isPlaying ? 'status-playing' :
                                  player.status === 'active' ? 'status-active' : 'status-inactive';
                
                const statusText = player.isPlaying ? 'Playing' :
                                 player.status === 'active' ? 'Active' : 'Inactive';
                
                html += `
                    <div class="player-card ${statusClass}">
                        <div class="player-header">
                            <div class="player-id">${player.screenId || playerId}</div>
                            <div class="status-badge ${statusBadge}">${statusText}</div>
                        </div>
                        
                        <div class="player-info">
                            <div class="info-row">
                                <span class="info-label">Machine ID:</span>
                                <span class="info-value">${playerId}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Screen ID:</span>
                                <span class="info-value">${player.screenId || 'N/A'}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Last Active:</span>
                                <span class="info-value">${formatTimestamp(player.lastActive)}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Last Update:</span>
                                <span class="info-value">${formatTimestamp(player.lastUpdate)}</span>
                            </div>
                        </div>
                        
                        ${player.currentAsset ? `
                            <div class="current-asset">
                                <div class="asset-title">Current Asset:</div>
                                <div class="asset-url">${player.currentAsset.assetUrl}</div>
                                 <img class="asset-url-img" src="${player.currentAsset.assetUrl}" alt="image">
                                <div class="timestamp">Updated: ${formatTimestamp(player.assetTimestamp)}</div>
                            </div>
                        ` : ''}
                    </div>
                `;
            });
            
            playersGrid.innerHTML = html;
            updateStats(totalPlayers, activePlayers, playingPlayers, inactivePlayers);
        }
        
        function updateStats(total, active, playing, inactive) {
            document.getElementById('totalPlayers').textContent = total;
            document.getElementById('activePlayers').textContent = active;
            document.getElementById('playingPlayers').textContent = playing;
            document.getElementById('inactivePlayers').textContent = inactive;
        }
        
        function formatTimestamp(timestamp) {
            if (!timestamp) return 'Never';
            const date = new Date(timestamp);
            return date.toLocaleString();
        }
        
        function refreshData() {
            // Clear existing data and reconnect
            players.clear();
            updateDisplay();
            socket.disconnect();
            socket.connect();
        }
        
        // Auto-refresh every 30 seconds
        setInterval(() => {
            if (socket.connected) {
                // Remove stale players (no update in last 2 minutes)
                const now = new Date();
                players.forEach((player, playerId) => {
                    const lastUpdate = new Date(player.lastUpdate);
                    if (now - lastUpdate > 120000) { // 2 minutes
                        players.delete(playerId);
                    }
                });
                updateDisplay();
            }
        }, 30000);
    </script>
</body>
</html>
